services:

  nginx:
    build: ./requirements/nginx
    image: nginx
    volumes:
      - wp_data:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception_network
    depends_on:
      - wordpress
    restart: always

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    env_file: 
      - .env
    volumes:
      - wp_data:/var/www/html
    networks:
      - inception_network
    depends_on:
      - mariadb
    restart: always
  
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: always

volumes:
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/naankour/data/wp_data

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/naankour/data/mariadb_data

networks:
  inception_network:
    driver: bridge

